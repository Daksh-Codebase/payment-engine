name: Verify payment reference
on:
  pull_request:
  push:
    branches: [main, feat/runnable-hackathon-baseline]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run build
      - run: npm run coverage
